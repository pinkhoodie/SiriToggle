name: Build SiriToggle IPA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Show available SDKs
        run: xcodebuild -showsdks

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project SiriToggle.xcodeproj \
            -scheme SiriToggle

      - name: Build unsigned IPA
        run: |
          xcodebuild \
            -project SiriToggle.xcodeproj \
            -scheme SiriToggle \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            IPHONEOS_DEPLOYMENT_TARGET=26.0 \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release" \
            build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r "build/Release/SiriToggle.app" Payload/SiriToggle.app
          /usr/bin/ditto -c -k --keepParent Payload SiriToggle.ipa
          rm -rf Payload/
          echo "IPA size: $(du -sh SiriToggle.ipa | cut -f1)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiriToggle-${{ github.sha }}
          path: SiriToggle.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Create Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: SiriToggle.ipa
          draft: false
          prerelease: true
          body: |
            ## SiriToggle ${{ github.ref_name }}
            
            Unsigned IPA — sideload with SideStore, AltStore, or TrollStore.
            
            ### Requirements
            - iOS 26 or later
            - Developer Mode enabled
            - iPhone 15 Pro or newer
            - .mobiledevicepairing file (generate with jitterbugpair)
            
            ### Install
            Use SideStore or AltStore to install the IPA.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
